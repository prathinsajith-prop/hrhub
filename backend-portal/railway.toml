[build]
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Uses the Dockerfile's CMD (sh entrypoint.sh). pnpm is NOT present in the
# runtime image — deps are baked in via the multi-stage build — so do NOT set
# a pnpm-based start command in the Railway dashboard. Also clear the
# dashboard "Start Command" field (Settings → Deploy) so this value takes effect.
startCommand = "sh entrypoint.sh"

# No pre-deploy step: migrations live in the main backend service. This service
# only reads/writes existing tables.
preDeploy = ""

# /health is dependency-free (no DB, no auth) and registered BEFORE any plugin in
# src/index.ts, so the LB probe never depends on the rest of the stack. Timeout
# is the total window Railway will wait for the first 200 — bcrypt's native
# binary rebuild on first cold boot can push initial readiness past 60s.
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
